name: "Tests"

on:
  - pull_request
  - push

defaults:
  run:
    working-directory: ./ci

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        operating-system: ['ubuntu-latest']
        php-version: ['8.3', '8.4', '8.5']

    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_DATABASE: tests
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: tests
          MYSQL_PASSWORD: tests
          MYSQL_ROOT_PASSWORD: tests
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        # Redis 8+ bundles the query engine and the other modules,
        # the image entrypoint loads them (no redis-stack needed)
        image: redis:latest
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on the service container to the host
          - 6379:6379
          
    name: PHP ${{ matrix.php-version }} Test on ${{ matrix.operating-system }}
    steps:
      - name: Install SSH keys
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.OVOS_PHP_LIBRARY }}
            ${{ secrets.OVOS_PHP_MODULE_SYSTEM }}
            ${{ secrets.OVOS_PHP_MODULE_ADMIN }}
    
      - name: Checkout Code
        uses: actions/checkout@v6
              
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none
          ini-values: apc.enabled=on, apc.enable_cli=on
          extensions: :xdebug, curl, fileinfo, gd, gettext, intl, mbstring, openssl, pdo_mysql, sockets, sodium, redis, yaml, apcu, opcache
      
      - name: Copy .env
        run: |
          php -r "file_exists('.env') || copy('.env.tests', '.env');"
      
      - name: Install dependencies
        #env:
          #COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{secrets.COMPOSER_AUTH}}"} }'
        run: composer prod:install

      # a real 3-master cluster in one container; services cannot override
      # the command, so this runs as a step (the redisearch module must be
      # loaded explicitly - bypassing the image entrypoint skips its
      # automatic --loadmodule handling)
      - name: Start Redis Cluster
        run: |
          docker run -d --name redis-cluster -p 7000-7002:7000-7002 -p 17000-17002:17000-17002 redis:latest \
            sh -c 'for port in 7000 7001 7002; do
                redis-server --port $port --loadmodule /usr/local/lib/redis/modules/redisearch.so \
                  --cluster-enabled yes --cluster-config-file /tmp/nodes-$port.conf \
                  --cluster-announce-ip 127.0.0.1 --cluster-announce-port $port --cluster-announce-bus-port 1$port \
                  --appendonly no --save "" --daemonize yes;
              done;
              sleep 2;
              redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 --cluster-replicas 0 --cluster-yes;
              tail -f /dev/null'
          for i in $(seq 1 30); do
            if docker exec redis-cluster redis-cli -p 7000 cluster info 2>/dev/null | grep -q 'cluster_state:ok'; then
              echo "cluster is up"; exit 0;
            fi;
            sleep 1;
          done
          echo "cluster failed to start"; docker logs redis-cluster; exit 1

      - name: "Run tests"
        run: php cli.php tests run
