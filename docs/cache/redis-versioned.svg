<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aSet" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
    <marker id="aGet" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
    <marker id="aInv" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ea580c"/></marker>
    <style>
      .title{font-size:18px;font-weight:700;fill:#fff}
      .badge{font-size:12px;fill:#cbd5e1}
      .panelLabel{font-size:11px;font-weight:700;fill:#64748b;letter-spacing:1.5px}
      .keyName{font-family:Consolas,monospace;font-size:12px;font-weight:700}
      .keyField{font-family:Consolas,monospace;font-size:10px;fill:#475569}
      .laneTab{font-size:12px;font-weight:700;fill:#fff}
      .stepMain{font-size:11.5px;fill:#0f172a}
      .stepSub{font-family:Consolas,monospace;font-size:9.5px;fill:#64748b}
      .stepNum{font-size:12px;font-weight:700;fill:#fff}
      .note{font-size:11px;fill:#15803d}
      .foot{font-size:11px;fill:#475569}
    </style>
  </defs>

  <rect width="940" height="580" fill="#ffffff"/>
  <rect width="940" height="46" fill="#1e293b"/>
  <text x="24" y="29" class="title">RedisVersioned &#8212; rule-based (logical) invalidation</text>
  <text x="916" y="29" text-anchor="end" class="badge">&#9679; standalone &#183; no module &#183; invalidation is O(1)</text>

  <!-- KEYS -->
  <rect x="16" y="62" width="908" height="138" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="84" class="panelLabel">KEYS IN REDIS</text>

  <rect x="32" y="98" width="330" height="90" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <rect x="33" y="99" width="5" height="88" fill="#0f766e"/>
  <text x="50" y="124" class="keyName" fill="#0f766e">items:&#123;key&#125;  (hash)</text>
  <text x="50" y="146" class="keyField">data &#8594; serialized + compressed value</text>
  <text x="50" y="163" class="keyField">tags &#8594; "a,b,c"  (csv)</text>
  <text x="50" y="180" class="keyField">mark &#8594; rules id seen at write ("watermark")</text>

  <rect x="378" y="98" width="350" height="90" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <rect x="379" y="99" width="5" height="88" fill="#be185d"/>
  <text x="396" y="124" class="keyName" fill="#be185d">rules  (stream)</text>
  <text x="396" y="146" class="keyField">each entry = one invalidation rule</text>
  <text x="396" y="163" class="keyField">&lt;ms&gt;-&lt;seq&gt; &#8594; &#123; mode: any|all, tags &#125;</text>
  <text x="396" y="180" class="keyField">id is monotonic &#8594; causal ordering, no clock</text>

  <rect x="744" y="98" width="164" height="90" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="760" y="124" class="keyName" fill="#334155">lifetime</text>
  <text x="760" y="146" class="keyField">items expire</text>
  <text x="760" y="163" class="keyField">by TTL, capped</text>
  <text x="760" y="180" class="keyField">at retention_s</text>

  <!-- SET lane -->
  <rect x="16" y="216" width="84" height="84" rx="10" fill="#16a34a"/>
  <text x="58" y="262" text-anchor="middle" class="laneTab">SET</text>
  <g>
    <rect x="116" y="216" width="176" height="84" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
    <circle cx="277" cy="231" r="11" fill="#16a34a"/><text x="277" y="235" text-anchor="middle" class="stepNum">1</text>
    <text x="130" y="256" class="stepMain">Serialize + compress</text>
    <text x="130" y="274" class="stepSub">client side</text>

    <rect x="320" y="216" width="176" height="84" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
    <circle cx="481" cy="231" r="11" fill="#16a34a"/><text x="481" y="235" text-anchor="middle" class="stepNum">2</text>
    <text x="334" y="256" class="stepMain">Read watermark</text>
    <text x="334" y="274" class="stepSub">FCALL ..._set (item+rules)</text>

    <rect x="524" y="216" width="176" height="84" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
    <circle cx="685" cy="231" r="11" fill="#16a34a"/><text x="685" y="235" text-anchor="middle" class="stepNum">3</text>
    <text x="538" y="256" class="stepMain">Stamp + write item</text>
    <text x="538" y="274" class="stepSub">HSET data,tags,mark</text>

    <rect x="728" y="216" width="176" height="84" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
    <circle cx="889" cy="231" r="11" fill="#16a34a"/><text x="889" y="235" text-anchor="middle" class="stepNum">4</text>
    <text x="742" y="256" class="stepMain">Expire (&#8804; retention)</text>
    <text x="742" y="274" class="stepSub">PEXPIRE item</text>

    <line x1="294" y1="258" x2="318" y2="258" stroke="#16a34a" stroke-width="2" marker-end="url(#aSet)"/>
    <line x1="498" y1="258" x2="522" y2="258" stroke="#16a34a" stroke-width="2" marker-end="url(#aSet)"/>
    <line x1="702" y1="258" x2="726" y2="258" stroke="#16a34a" stroke-width="2" marker-end="url(#aSet)"/>
  </g>

  <!-- GET lane -->
  <rect x="16" y="316" width="84" height="84" rx="10" fill="#2563eb"/>
  <text x="58" y="362" text-anchor="middle" class="laneTab">GET</text>
  <g>
    <rect x="116" y="316" width="176" height="84" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="277" cy="331" r="11" fill="#2563eb"/><text x="277" y="335" text-anchor="middle" class="stepNum">1</text>
    <text x="130" y="356" class="stepMain">Fetch item</text>
    <text x="130" y="374" class="stepSub">HMGET data,tags,mark</text>

    <rect x="320" y="316" width="176" height="84" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="481" cy="331" r="11" fill="#2563eb"/><text x="481" y="335" text-anchor="middle" class="stepNum">2</text>
    <text x="334" y="356" class="stepMain">Eval rules &gt; mark in PHP</text>
    <text x="334" y="374" class="stepSub">isStale() over cached rules</text>
    <text x="334" y="390" class="stepSub" fill="#b91c1c">stale &#8594; UNLINK, miss</text>

    <rect x="524" y="316" width="176" height="84" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="685" cy="331" r="11" fill="#2563eb"/><text x="685" y="335" text-anchor="middle" class="stepNum">3</text>
    <text x="538" y="356" class="stepMain">Fresh? &#8594; value</text>
    <text x="538" y="374" class="stepSub">decompress + unserialize</text>
    <text x="538" y="390" class="stepSub">(data already fetched)</text>

    <line x1="294" y1="358" x2="318" y2="358" stroke="#2563eb" stroke-width="2" marker-end="url(#aGet)"/>
    <line x1="498" y1="358" x2="522" y2="358" stroke="#2563eb" stroke-width="2" marker-end="url(#aGet)"/>
  </g>
  <text x="724" y="350" class="stepSub" fill="#1e40af">The rules are fetched once</text>
  <text x="724" y="365" class="stepSub" fill="#1e40af">(XRANGE) and cached rules_cache_ms;</text>
  <text x="724" y="380" class="stepSub" fill="#1e40af">reads evaluate them in PHP, not</text>
  <text x="724" y="395" class="stepSub" fill="#1e40af">re-scanned on the server each time.</text>

  <!-- INVALIDATE lane -->
  <rect x="16" y="416" width="84" height="84" rx="10" fill="#ea580c"/>
  <text x="58" y="458" text-anchor="middle" class="laneTab">INVALI-</text>
  <text x="58" y="474" text-anchor="middle" class="laneTab">DATE</text>
  <g>
    <rect x="116" y="416" width="176" height="84" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/>
    <circle cx="277" cy="431" r="11" fill="#ea580c"/><text x="277" y="435" text-anchor="middle" class="stepNum">1</text>
    <text x="130" y="456" class="stepMain">Append one rule</text>
    <text x="130" y="474" class="stepSub">XADD rules (mode,tags)</text>

    <rect x="320" y="416" width="176" height="84" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/>
    <circle cx="481" cy="431" r="11" fill="#ea580c"/><text x="481" y="435" text-anchor="middle" class="stepNum">2</text>
    <text x="334" y="456" class="stepMain">Trim + expire stream</text>
    <text x="334" y="474" class="stepSub">XTRIM &#183; PEXPIRE</text>

    <rect x="524" y="416" width="384" height="84" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="540" y="442" class="note" font-weight="700">Cost: O(1) &#8212; whether 10 or 700 000 items match</text>
    <text x="540" y="464" class="stepSub" fill="#15803d">Matched items are NOT touched. They stay in memory,</text>
    <text x="540" y="480" class="stepSub" fill="#15803d">become invisible on the next read, then expire by TTL.</text>

    <line x1="294" y1="458" x2="318" y2="458" stroke="#ea580c" stroke-width="2" marker-end="url(#aInv)"/>
    <line x1="498" y1="458" x2="522" y2="458" stroke="#ea580c" stroke-width="2" marker-end="url(#aInv)"/>
  </g>

  <line x1="16" y1="518" x2="924" y2="518" stroke="#e2e8f0"/>
  <text x="16" y="538" class="foot"><tspan font-weight="700">Invalidation:</tspan> O(1) rule append &#183; lazy unlink on read, else TTL expiry  &#183;  <tspan font-weight="700">clear():</tspan> logical (one "all" rule); clearPhysical() wipes the group</text>
  <text x="16" y="556" class="foot"><tspan font-weight="700">Lua:</tspan> cache_versioned_set / _invalidate  &#183;  <tspan font-weight="700">retention_s</tspan> = default AND max item lifetime  &#183;  <tspan font-weight="700">Cluster:</tspan> no (2-key write)</text>
</svg>
