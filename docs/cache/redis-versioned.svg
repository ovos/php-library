<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
	<defs>
		<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
			<rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
		</pattern>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="4" result="halo"/>
			<feComponentTransfer in="halo" result="dim">
				<feFuncA type="linear" slope="0.45"/>
			</feComponentTransfer>
			<feMerge>
				<feMergeNode in="dim"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
		<marker id="aSet" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#00f0ff"/></marker>
		<marker id="aGet" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#fcee0a"/></marker>
		<marker id="aInv" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff003c"/></marker>
		<style>
			.title{font-size:15px;font-weight:700;fill:#fcee0a;letter-spacing:2px}
			.badge{font-family:Consolas,'Courier New',monospace;font-size:11px;fill:#8b8ba7;letter-spacing:1px}
			.panelLabel{font-size:11px;font-weight:700;fill:#8b8ba7;letter-spacing:3px}
			.keyName{font-family:Consolas,'Courier New',monospace;font-size:12px;font-weight:700}
			.keyField{font-family:Consolas,'Courier New',monospace;font-size:10px;fill:#8b8ba7}
			.laneTab{font-size:12px;font-weight:800;fill:#0a0a12;letter-spacing:2px}
			.stepMain{font-size:11.5px;fill:#e8e8f0}
			.stepSub{font-family:Consolas,'Courier New',monospace;font-size:9.5px;fill:#8b8ba7}
			.stepNum{font-size:12px;font-weight:700;fill:#0a0a12}
			.note{font-size:11px;fill:#00f0ff}
			.foot{font-size:11px;fill:#8b8ba7}
		</style>
	</defs>

	<!-- canvas: chamfered plate -->
	<path d="M14,0 H926 L940,14 V566 L926,580 H14 L0,566 V14 Z" fill="#0a0a12"/>
	<path d="M14,0 H926 L940,14 V566 L926,580 H14 L0,566 V14 Z" fill="url(#scan)"/>
	<path d="M14,0.5 H926 L939.5,14 V566 L926,579.5 H14 L0.5,566 V14 Z" fill="none" stroke="#fcee0a" stroke-width="1" opacity="0.8"/>
	<path d="M0,40 V14 L14,0.5 H40" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
	<path d="M940,540 V566 L926,579.5 H900" fill="none" stroke="#00f0ff" stroke-width="2.5"/>

	<!-- header strip -->
	<path d="M14,0 H926 L940,14 V46 H0 V14 Z" fill="#0d0d17"/>
	<line x1="0" y1="46.5" x2="940" y2="46.5" stroke="#fcee0a" stroke-width="1" opacity="0.5"/>
	<text x="24" y="30" class="title" filter="url(#glow)">REDISVERSIONED &#8212; RULE-BASED (LOGICAL) INVALIDATION</text>
	<text x="916" y="30" text-anchor="end" class="badge"><tspan fill="#00f0ff">&#9679;</tspan> standalone &#183; no module &#183; invalidation is O(1)</text>

	<!-- KEYS -->
	<path d="M16,62 H914 L924,72 V190 L914,200 H26 L16,190 Z" fill="#0d0d17" stroke="#8b8ba7" stroke-opacity="0.4"/>
	<text x="32" y="84" class="panelLabel">KEYS IN REDIS</text>

	<path d="M32,98 H352 L362,108 V178 L352,188 H32 Z" fill="#11111c" stroke="#00f0ff" stroke-opacity="0.75"/>
	<rect x="33" y="99" width="4" height="88" fill="#00f0ff"/>
	<text x="50" y="124" class="keyName" fill="#00f0ff">items:&#123;key&#125;  (hash)</text>
	<text x="50" y="146" class="keyField">data &#8594; serialized + compressed value</text>
	<text x="50" y="163" class="keyField">tags &#8594; "a,b,c"  (csv)</text>
	<text x="50" y="180" class="keyField">mark &#8594; rules id seen at write ("watermark")</text>

	<path d="M378,98 H718 L728,108 V178 L718,188 H378 Z" fill="#11111c" stroke="#ff003c" stroke-opacity="0.75"/>
	<rect x="379" y="99" width="4" height="88" fill="#ff003c"/>
	<text x="396" y="124" class="keyName" fill="#ff003c">rules  (stream)</text>
	<text x="396" y="146" class="keyField">each entry = one invalidation rule</text>
	<text x="396" y="163" class="keyField">&lt;ms&gt;-&lt;seq&gt; &#8594; &#123; mode: any|all, tags &#125;</text>
	<text x="396" y="180" class="keyField">id is monotonic &#8594; causal ordering, no clock</text>

	<path d="M744,98 H898 L908,108 V178 L898,188 H744 Z" fill="#11111c" stroke="#8b8ba7" stroke-opacity="0.55"/>
	<text x="760" y="124" class="keyName" fill="#e8e8f0">lifetime</text>
	<text x="760" y="146" class="keyField">items expire</text>
	<text x="760" y="163" class="keyField">by TTL, capped</text>
	<text x="760" y="180" class="keyField">at retention_s</text>

	<!-- SET lane -->
	<path d="M16,216 H90 L100,226 V290 L90,300 H16 Z" fill="#00f0ff"/>
	<text x="58" y="262" text-anchor="middle" class="laneTab">SET</text>
	<g>
		<path d="M116,216 H282 L292,226 V300 H116 Z" fill="#11111c" stroke="#00f0ff" stroke-opacity="0.75"/>
		<circle cx="277" cy="231" r="11" fill="#00f0ff"/><text x="277" y="235" text-anchor="middle" class="stepNum">1</text>
		<text x="130" y="256" class="stepMain">Serialize + compress</text>
		<text x="130" y="274" class="stepSub">client side</text>

		<path d="M320,216 H486 L496,226 V300 H320 Z" fill="#11111c" stroke="#00f0ff" stroke-opacity="0.75"/>
		<circle cx="481" cy="231" r="11" fill="#00f0ff"/><text x="481" y="235" text-anchor="middle" class="stepNum">2</text>
		<text x="334" y="256" class="stepMain">Read watermark</text>
		<text x="334" y="274" class="stepSub">FCALL ..._set (item+rules)</text>

		<path d="M524,216 H690 L700,226 V300 H524 Z" fill="#11111c" stroke="#00f0ff" stroke-opacity="0.75"/>
		<circle cx="685" cy="231" r="11" fill="#00f0ff"/><text x="685" y="235" text-anchor="middle" class="stepNum">3</text>
		<text x="538" y="256" class="stepMain">Stamp + write item</text>
		<text x="538" y="274" class="stepSub">HSET data,tags,mark</text>

		<path d="M728,216 H894 L904,226 V300 H728 Z" fill="#11111c" stroke="#00f0ff" stroke-opacity="0.75"/>
		<circle cx="889" cy="231" r="11" fill="#00f0ff"/><text x="889" y="235" text-anchor="middle" class="stepNum">4</text>
		<text x="742" y="256" class="stepMain">Expire (&#8804; retention)</text>
		<text x="742" y="274" class="stepSub">PEXPIRE item</text>

		<line x1="294" y1="258" x2="318" y2="258" stroke="#00f0ff" stroke-width="2" marker-end="url(#aSet)"/>
		<line x1="498" y1="258" x2="522" y2="258" stroke="#00f0ff" stroke-width="2" marker-end="url(#aSet)"/>
		<line x1="702" y1="258" x2="726" y2="258" stroke="#00f0ff" stroke-width="2" marker-end="url(#aSet)"/>
	</g>

	<!-- GET lane -->
	<path d="M16,316 H90 L100,326 V390 L90,400 H16 Z" fill="#fcee0a"/>
	<text x="58" y="362" text-anchor="middle" class="laneTab">GET</text>
	<g>
		<path d="M116,316 H282 L292,326 V400 H116 Z" fill="#11111c" stroke="#fcee0a" stroke-opacity="0.75"/>
		<circle cx="277" cy="331" r="11" fill="#fcee0a"/><text x="277" y="335" text-anchor="middle" class="stepNum">1</text>
		<text x="130" y="356" class="stepMain">Fetch item</text>
		<text x="130" y="374" class="stepSub">HMGET data,tags,mark</text>

		<path d="M320,316 H486 L496,326 V400 H320 Z" fill="#11111c" stroke="#fcee0a" stroke-opacity="0.75"/>
		<circle cx="481" cy="331" r="11" fill="#fcee0a"/><text x="481" y="335" text-anchor="middle" class="stepNum">2</text>
		<text x="334" y="356" class="stepMain">Eval rules &gt; mark in PHP</text>
		<text x="334" y="374" class="stepSub">isStale() over cached rules</text>
		<text x="334" y="390" class="stepSub" fill="#ff003c">stale &#8594; UNLINK, miss</text>

		<path d="M524,316 H690 L700,326 V400 H524 Z" fill="#11111c" stroke="#fcee0a" stroke-opacity="0.75"/>
		<circle cx="685" cy="331" r="11" fill="#fcee0a"/><text x="685" y="335" text-anchor="middle" class="stepNum">3</text>
		<text x="538" y="356" class="stepMain">Fresh? &#8594; value</text>
		<text x="538" y="374" class="stepSub">decompress + unserialize</text>
		<text x="538" y="390" class="stepSub">(data already fetched)</text>

		<line x1="294" y1="358" x2="318" y2="358" stroke="#fcee0a" stroke-width="2" marker-end="url(#aGet)"/>
		<line x1="498" y1="358" x2="522" y2="358" stroke="#fcee0a" stroke-width="2" marker-end="url(#aGet)"/>
	</g>
	<text x="724" y="350" class="stepSub" fill="#fcee0a" opacity="0.85">The rules are fetched once</text>
	<text x="724" y="365" class="stepSub" fill="#fcee0a" opacity="0.85">(XRANGE) and cached rules_cache_ms;</text>
	<text x="724" y="380" class="stepSub" fill="#fcee0a" opacity="0.85">reads evaluate them in PHP, not</text>
	<text x="724" y="395" class="stepSub" fill="#fcee0a" opacity="0.85">re-scanned on the server each time.</text>

	<!-- INVALIDATE lane -->
	<path d="M16,416 H90 L100,426 V490 L90,500 H16 Z" fill="#ff003c"/>
	<text x="58" y="458" text-anchor="middle" class="laneTab">INVALI-</text>
	<text x="58" y="474" text-anchor="middle" class="laneTab">DATE</text>
	<g>
		<path d="M116,416 H282 L292,426 V500 H116 Z" fill="#11111c" stroke="#ff003c" stroke-opacity="0.75"/>
		<circle cx="277" cy="431" r="11" fill="#ff003c"/><text x="277" y="435" text-anchor="middle" class="stepNum">1</text>
		<text x="130" y="456" class="stepMain">Append one rule</text>
		<text x="130" y="474" class="stepSub">XADD rules (mode,tags)</text>

		<path d="M320,416 H486 L496,426 V500 H320 Z" fill="#11111c" stroke="#ff003c" stroke-opacity="0.75"/>
		<circle cx="481" cy="431" r="11" fill="#ff003c"/><text x="481" y="435" text-anchor="middle" class="stepNum">2</text>
		<text x="334" y="456" class="stepMain">Trim + expire stream</text>
		<text x="334" y="474" class="stepSub">XTRIM &#183; PEXPIRE</text>

		<path d="M524,416 H898 L908,426 V490 L898,500 H524 Z" fill="#0d0d17" stroke="#00f0ff" stroke-opacity="0.6"/>
		<text x="540" y="442" class="note" font-weight="700">Cost: O(1) &#8212; whether 10 or 700 000 items match</text>
		<text x="540" y="464" class="stepSub" fill="#00f0ff" opacity="0.75">Matched items are NOT touched. They stay in memory,</text>
		<text x="540" y="480" class="stepSub" fill="#00f0ff" opacity="0.75">become invisible on the next read, then expire by TTL.</text>

		<line x1="294" y1="458" x2="318" y2="458" stroke="#ff003c" stroke-width="2" marker-end="url(#aInv)"/>
		<line x1="498" y1="458" x2="522" y2="458" stroke="#ff003c" stroke-width="2" marker-end="url(#aInv)"/>
	</g>

	<line x1="16" y1="518" x2="924" y2="518" stroke="#8b8ba7" stroke-opacity="0.3"/>
	<text x="16" y="538" class="foot"><tspan font-weight="700" fill="#e8e8f0">Invalidation:</tspan> O(1) rule append &#183; lazy unlink on read, else TTL expiry  &#183;  <tspan font-weight="700" fill="#e8e8f0">clear():</tspan> logical (one "all" rule); clearPhysical() wipes the group</text>
	<text x="16" y="556" class="foot"><tspan font-weight="700" fill="#e8e8f0">Lua:</tspan> cache_versioned_set / _invalidate  &#183;  <tspan font-weight="700" fill="#e8e8f0">retention_s</tspan> = default AND max item lifetime  &#183;  <tspan font-weight="700" fill="#e8e8f0">Cluster:</tspan> no (2-key write)</text>
</svg>
