<svg xmlns="http://www.w3.org/2000/svg" width="960" height="884" viewBox="0 0 960 884" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aGet" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
    <marker id="aOk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
    <marker id="aBad" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
    <style>
      .title{font-size:18px;font-weight:700;fill:#fff}
      .badge{font-size:12px;fill:#cbd5e1}
      .panelLabel{font-size:11px;font-weight:700;fill:#64748b;letter-spacing:1px}
      .keyName{font-family:Consolas,monospace;font-size:12px;font-weight:700}
      .keyField{font-family:Consolas,monospace;font-size:11px;fill:#334155}
      .zoneLabel{font-size:11.5px;font-weight:700;fill:#475569;text-anchor:middle}
      .ruleId{font-family:Consolas,monospace;font-size:12px;font-weight:700;text-anchor:middle}
      .ruleBody{font-family:Consolas,monospace;font-size:10.5px;text-anchor:middle}
      .wm{font-size:11px;font-weight:700;fill:#4f46e5;text-anchor:middle}
      .note{font-size:10.5px;text-anchor:middle}
      .boxTitle{font-size:12.5px;font-weight:700}
      .step{font-family:Consolas,monospace;font-size:11.5px;fill:#0f172a}
      .stepDim{font-family:Consolas,monospace;font-size:11px;fill:#64748b}
      .flow{font-family:Consolas,monospace;font-size:11px;fill:#1e40af}
      .foot{font-size:11px;fill:#475569}
      .outTitle{font-size:12px;font-weight:700}
      .outBody{font-size:11px;fill:#334155}
    </style>
  </defs>

  <rect width="960" height="884" fill="#ffffff"/>
  <rect width="960" height="46" fill="#1e293b"/>
  <text x="24" y="29" class="title">RedisVersioned &#8212; cache GET (read): tags, versions and the cached rule set</text>
  <text x="936" y="29" text-anchor="end" class="badge">&#9679; lazy, version-based invalidation</text>

  <!-- ============ THE TWO KEYS ============ -->
  <rect x="16" y="60" width="928" height="132" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="82" class="panelLabel">THE TWO KEYS A READ TOUCHES</text>

  <rect x="32" y="94" width="438" height="86" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <rect x="33" y="95" width="5" height="84" fill="#0f766e"/>
  <text x="50" y="116" class="keyName" fill="#0f766e">items:user:42:profile  (hash)</text>
  <text x="50" y="138" class="keyField">data &#8594; serialized + compressed value</text>
  <text x="50" y="156" class="keyField">tags &#8594; "user:42,products,cart"</text>
  <text x="50" y="174" class="keyField">mark &#8594; "5-0"   &#8592; version seen at write</text>

  <rect x="486" y="94" width="458" height="86" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <rect x="487" y="95" width="5" height="84" fill="#be185d"/>
  <text x="504" y="116" class="keyName" fill="#be185d">rules  (stream)</text>
  <text x="504" y="138" class="keyField">each entry = one invalidation rule { mode, tags }</text>
  <text x="504" y="156" class="keyField">id = "&lt;ms&gt;-&lt;seq&gt;", monotonic &#8594; it acts as a version</text>
  <text x="504" y="174" class="keyField">a read never deletes here; set() appends, reads only scan</text>

  <!-- ============ VERSION TIMELINE ============ -->
  <rect x="16" y="206" width="928" height="222" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="228" class="panelLabel">VERSIONS &#8212; A READ EVALUATES ONLY THE RULES NEWER THAN THE ITEM'S MARK</text>

  <!-- zones -->
  <rect x="32" y="246" width="446" height="120" rx="6" fill="#eef2f7"/>
  <rect x="482" y="246" width="446" height="120" rx="6" fill="#fdf2f8"/>
  <text x="255" y="266" class="zoneLabel">id &#8804; mark &#183; already seen at write &#183; SKIPPED</text>
  <text x="705" y="266" class="zoneLabel">id &gt; mark &#183; EVALUATED IN PHP</text>

  <!-- axis -->
  <line x1="48" y1="320" x2="912" y2="320" stroke="#cbd5e1" stroke-width="2"/>

  <!-- rule cards on the timeline -->
  <!-- skipped -->
  <g>
    <rect x="70" y="296" width="170" height="48" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="70" cy="320" r="5" fill="#94a3b8"/>
    <text x="155" y="315" class="ruleId" fill="#64748b">3-0</text>
    <text x="155" y="333" class="ruleBody" fill="#64748b">{ any: news }</text>

    <rect x="262" y="296" width="170" height="48" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="262" cy="320" r="5" fill="#94a3b8"/>
    <text x="347" y="315" class="ruleId" fill="#64748b">5-0</text>
    <text x="347" y="333" class="ruleBody" fill="#64748b">{ all: user:42,products }</text>
  </g>

  <!-- watermark -->
  <line x1="480" y1="250" x2="480" y2="392" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="480" y="406" class="wm">&#8593; item.mark = "5-0" (version)</text>

  <!-- evaluated -->
  <g>
    <rect x="528" y="296" width="170" height="48" rx="6" fill="#fff" stroke="#dc2626" stroke-width="1.6"/>
    <circle cx="528" cy="320" r="5" fill="#dc2626"/>
    <text x="613" y="315" class="ruleId" fill="#b91c1c">8-0</text>
    <text x="613" y="333" class="ruleBody" fill="#b91c1c">{ any: products }</text>
    <text x="613" y="384" class="note" fill="#b91c1c">&#10003; "products" overlaps (any) &#8594; STALE</text>

    <rect x="730" y="296" width="170" height="48" rx="6" fill="#fff" stroke="#dc2626" stroke-width="1.6"/>
    <circle cx="730" cy="320" r="5" fill="#dc2626"/>
    <text x="815" y="315" class="ruleId" fill="#b91c1c">11-0</text>
    <text x="815" y="333" class="ruleBody" fill="#b91c1c">{ all: products,cart }</text>
    <text x="815" y="384" class="note" fill="#b91c1c">&#10003; all tags present (all)</text>
  </g>

  <!-- ============ READ FLOW ============ -->
  <!-- step 1: PHP call -->
  <rect x="288" y="442" width="384" height="40" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="467" text-anchor="middle" class="step">PHP: $store-&gt;get('user:42:profile')</text>

  <line x1="480" y1="482" x2="480" y2="502" stroke="#2563eb" stroke-width="2" marker-end="url(#aGet)"/>
  <text x="496" y="496" class="flow">HMGET item &#8594; data, tags, mark &#183; the only round-trip on a hit</text>

  <!-- step 2: client-side evaluation -->
  <rect x="150" y="504" width="660" height="158" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="526" class="boxTitle" fill="#1e40af">Inside the read &#8212; evaluated client-side over the cached rule set</text>
  <text x="170" y="552" class="step"><tspan fill="#2563eb" font-weight="700">1.</tspan> HMGET item &#8594; data, tags = "user:42,products,cart", mark = "5-0"   <tspan class="stepDim">(data comes too)</tspan></text>
  <text x="170" y="576" class="step"><tspan fill="#2563eb" font-weight="700">2.</tspan> getRules(): live rules fetched once per rules_cache_ms (one XRANGE) and cached in PHP</text>
  <text x="170" y="600" class="step"><tspan fill="#2563eb" font-weight="700">3.</tspan> isStale(): in PHP, evaluate only rules with id &gt; mark &#8594; 8-0, 11-0   <tspan class="stepDim">(skips 3-0, 5-0)</tspan></text>
  <text x="170" y="624" class="step"><tspan fill="#2563eb" font-weight="700">4.</tspan> match each:  any &#8594; tags overlap   &#183;   all &#8594; rule.tags &#8838; item.tags   &#8594; 8-0 { any: products } &#8594; STALE</text>
  <text x="170" y="650" class="stepDim">on a hit the data is already in hand (the HMGET above) &#8594; no second round trip</text>

  <line x1="480" y1="662" x2="480" y2="682" stroke="#2563eb" stroke-width="2" marker-end="url(#aGet)"/>

  <!-- verdict -->
  <rect x="376" y="684" width="208" height="38" rx="19" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="480" y="708" text-anchor="middle" class="step" fill="#92400e">verdict (in PHP): fresh / stale</text>

  <!-- branches -->
  <path d="M440 722 L210 744" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#aOk)"/>
  <path d="M520 722 L744 744" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#aBad)"/>
  <text x="300" y="722" class="outTitle" fill="#15803d" text-anchor="middle">fresh</text>
  <text x="660" y="722" class="outTitle" fill="#b91c1c" text-anchor="middle">stale</text>

  <rect x="40" y="746" width="420" height="74" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="56" y="768" class="outTitle" fill="#15803d">FRESH HIT</text>
  <text x="56" y="788" class="outBody">the data field was already fetched by the HMGET above</text>
  <text x="56" y="806" class="outBody">&#8594; decompress + unserialize &#8594; return the value</text>

  <rect x="500" y="746" width="420" height="74" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="516" y="768" class="outTitle" fill="#b91c1c">STALE &#8594; MISS</text>
  <text x="516" y="788" class="outBody">UNLINK the item (lazy delete); MemoLock + resolver</text>
  <text x="516" y="806" class="outBody">rebuild it &#8211; set() stamps a fresh mark (the latest rule id)</text>

  <line x1="16" y1="836" x2="944" y2="836" stroke="#e2e8f0"/>
  <text x="16" y="855" class="foot">One round-trip on a hit: the HMGET returns the data, and the rule set is cached for rules_cache_ms (not re-read on every get).</text>
  <text x="16" y="872" class="foot">A read may therefore act on rules up to rules_cache_ms old &#8212; bounded, self-healing staleness (eventual consistency).</text>
</svg>
