<svg xmlns="http://www.w3.org/2000/svg" width="940" height="726" viewBox="0 0 940 726" font-family="Segoe UI, Helvetica, Arial, sans-serif">
	<defs>
		<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
			<rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
		</pattern>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="4" result="halo"/>
			<feComponentTransfer in="halo" result="dim">
				<feFuncA type="linear" slope="0.45"/>
			</feComponentTransfer>
			<feMerge>
				<feMergeNode in="dim"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
		<style>
			.title{font-size:17px;font-weight:700;fill:#fcee0a;letter-spacing:2px}
			.subtitle{font-size:12px;fill:#8b8ba7;letter-spacing:0.5px}
			.panelHead{font-size:12.5px;font-weight:700;letter-spacing:1.5px;text-anchor:middle}
			.rowHead{font-family:Consolas,'Courier New',monospace;font-size:10.5px;font-weight:700;text-anchor:end}
			.evt{font-family:Consolas,'Courier New',monospace;font-size:10.5px;fill:#e8e8f0;text-anchor:start}
			.seg{font-family:Consolas,'Courier New',monospace;font-size:11px;font-weight:700;text-anchor:middle;letter-spacing:1px}
			.tick{font-family:Consolas,'Courier New',monospace;font-size:10px;fill:#8b8ba7;text-anchor:middle}
			.lblC{font-size:11px;fill:#8b8ba7;text-anchor:middle}
			.code{font-family:Consolas,'Courier New',monospace;font-size:10.5px;fill:#e8e8f0;text-anchor:middle}
			.note{font-size:10.5px;fill:#8b8ba7;text-anchor:middle}
			.foot{font-size:11px;fill:#8b8ba7}
		</style>
	</defs>
	
	<!-- canvas: chamfered plate -->
	<path d="M14,0 H926 L940,14 V712 L926,726 H14 L0,712 V14 Z" fill="#0a0a12"/>
	<path d="M14,0 H926 L940,14 V712 L926,726 H14 L0,712 V14 Z" fill="url(#scan)"/>
	<path d="M14,0.5 H926 L939.5,14 V712 L926,725.5 H14 L0.5,712 V14 Z" fill="none" stroke="#fcee0a" stroke-width="1" opacity="0.8"/>
	<path d="M0,40 V14 L14,0.5 H40" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
	<path d="M940,686 V712 L926,725.5 H900" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
	
	<!-- header -->
	<text x="24" y="28" class="title" filter="url(#glow)">A VALUE&#8217;S LIFE &#8212; one get(), every option</text>
	<text x="24" y="47" class="subtitle">What a read gets over time, what an invalidation does to the value, and what the resolver decides</text>
	<rect x="24" y="55" width="160" height="2" fill="#00f0ff"/>
	<rect x="192" y="55" width="10" height="2" fill="#00f0ff" opacity="0.55"/>
	<rect x="210" y="55" width="4" height="2" fill="#00f0ff" opacity="0.3"/>
	
	<!-- ============ OVER TIME ============ -->
	<path d="M28,72 H924 V306 L912,318 H16 V84 Z" fill="#0d0d17" stroke="#fcee0a" stroke-width="1" opacity="0.9"/>
	<path d="M28,72 H924 V100 H16 V84 Z" fill="#fcee0a" opacity="0.1"/>
	<line x1="16" y1="100" x2="924" y2="100" stroke="#fcee0a" stroke-width="1" opacity="0.7"/>
	<text x="470" y="91" class="panelHead" fill="#fcee0a">OVER TIME &#8212; get($key, $resolver, ttl: 300, stale: 60, staleIfError: 3600)</text>
	<g>
		<text x="190" y="134" class="rowHead" fill="#8b8ba7">get()</text>
		<rect x="200" y="118" width="220" height="24" fill="#00f0ff" fill-opacity="0.16" stroke="#00f0ff"/>
		<text x="310" y="134" class="seg" fill="#00f0ff">FRESH</text>
		<rect x="420" y="118" width="490" height="24" fill="#ff003c" fill-opacity="0.1" stroke="#ff003c"/>
		<text x="665" y="134" class="seg" fill="#ff003c">MISS</text>
		<text x="190" y="172" class="rowHead" fill="#fcee0a">+ stale: 60</text>
		<rect x="200" y="156" width="220" height="24" fill="#00f0ff" fill-opacity="0.16" stroke="#00f0ff"/>
		<text x="310" y="172" class="seg" fill="#00f0ff">FRESH</text>
		<rect x="420" y="156" width="150" height="24" fill="#fcee0a" fill-opacity="0.14" stroke="#fcee0a"/>
		<text x="495" y="172" class="seg" fill="#fcee0a">STALE</text>
		<rect x="570" y="156" width="340" height="24" fill="#ff003c" fill-opacity="0.1" stroke="#ff003c"/>
		<text x="740" y="172" class="seg" fill="#ff003c">MISS</text>
		<text x="190" y="210" class="rowHead" fill="#ff9f1c">+ staleIfError: 3600</text>
		<rect x="200" y="194" width="220" height="24" fill="#00f0ff" fill-opacity="0.16" stroke="#00f0ff"/>
		<text x="310" y="210" class="seg" fill="#00f0ff">FRESH</text>
		<rect x="420" y="194" width="150" height="24" fill="#fcee0a" fill-opacity="0.14" stroke="#fcee0a"/>
		<text x="495" y="210" class="seg" fill="#fcee0a">STALE</text>
		<rect x="570" y="194" width="210" height="24" fill="#ff9f1c" fill-opacity="0.12" stroke="#ff9f1c"/>
		<text x="675" y="210" class="seg" fill="#ff9f1c">KEPT FOR ERRORS</text>
		<rect x="780" y="194" width="130" height="24" fill="#ff003c" fill-opacity="0.1" stroke="#ff003c"/>
		<text x="845" y="210" class="seg" fill="#ff003c">MISS</text>
		<line x1="200" y1="112" x2="200" y2="234" stroke="#8b8ba7" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
		<text x="200" y="246" class="tick">stored</text>
		<line x1="420" y1="112" x2="420" y2="234" stroke="#8b8ba7" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
		<text x="420" y="246" class="tick">ttl</text>
		<line x1="570" y1="112" x2="570" y2="234" stroke="#8b8ba7" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
		<text x="570" y="246" class="tick">+ stale</text>
		<line x1="780" y1="112" x2="780" y2="234" stroke="#8b8ba7" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
		<text x="780" y="246" class="tick">+ staleIfError</text>
		<text x="310" y="270" class="lblC" style="fill:#00f0ff">a hit: the value,</text>
		<text x="310" y="285" class="lblC">nothing is computed</text>
		<text x="495" y="270" class="lblC" style="fill:#fcee0a">served at once, to all;</text>
		<text x="495" y="285" class="lblC">ONE process refreshes it</text>
		<text x="675" y="270" class="lblC" style="fill:#ff9f1c">a miss, computed at once &#8212;</text>
		<text x="675" y="285" class="lblC">if it throws: the kept value</text>
		<text x="845" y="270" class="lblC" style="fill:#ff003c">a miss: one computes,</text>
		<text x="845" y="285" class="lblC">the others wait for it</text>
		<text x="200" y="310" class="note" style="text-anchor:start">the refresh runs after the response (a web request) or inline (CLI), elected by MemoLock::tryLock() &#8212; nobody waits</text>
	</g>
	
	<!-- ============ EVENTS ============ -->
	<path d="M28,332 H924 V550 L912,562 H16 V344 Z" fill="#0d0d17" stroke="#ff003c" stroke-width="1" opacity="0.9"/>
	<path d="M28,332 H924 V360 H16 V344 Z" fill="#ff003c" opacity="0.1"/>
	<line x1="16" y1="360" x2="924" y2="360" stroke="#ff003c" stroke-width="1" opacity="0.7"/>
	<text x="470" y="351" class="panelHead" fill="#ff003c">WHAT AN INVALIDATION DOES &#8212; and a forced refresh</text>
	<g>
		<text x="40" y="390" class="evt">delete($key) &#183; clear()</text>
		<rect x="380" y="374" width="530" height="24" fill="#ff003c" fill-opacity="0.1" stroke="#ff003c"/>
		<text x="645" y="390" class="seg" fill="#ff003c">MISS AT ONCE &#8212; every value</text>
		<text x="40" y="422" class="evt">invalidateTags($tags)</text>
		<rect x="380" y="406" width="530" height="24" fill="#ff003c" fill-opacity="0.1" stroke="#ff003c"/>
		<text x="645" y="422" class="seg" fill="#ff003c">MISS AT ONCE &#8212; a value written without soft</text>
		<text x="40" y="454" class="evt">invalidateTags($tags) &#8212; soft: true</text>
		<rect x="380" y="438" width="180" height="24" fill="#fcee0a" fill-opacity="0.14" stroke="#fcee0a"/>
		<text x="470" y="454" class="seg" fill="#fcee0a">STALE &#8212; the old value</text>
		<rect x="560" y="438" width="350" height="24" fill="#00f0ff" fill-opacity="0.16" stroke="#00f0ff"/>
		<text x="735" y="454" class="seg" fill="#00f0ff">FRESH &#8212; ONE recomputed it meanwhile</text>
		<text x="40" y="486" class="evt">invalidateTags($tags, hard: true)</text>
		<rect x="380" y="470" width="530" height="24" fill="#ff003c" fill-opacity="0.1" stroke="#ff003c"/>
		<text x="645" y="486" class="seg" fill="#ff003c">MISS AT ONCE &#8212; soft values too</text>
		<text x="40" y="518" class="evt">get(..., refresh: true)</text>
		<rect x="380" y="502" width="530" height="24" fill="#00f0ff" fill-opacity="0.16" stroke="#00f0ff"/>
		<text x="645" y="518" class="seg" fill="#00f0ff">RECOMPUTED NOW &#8212; whatever is cached</text>
		<text x="470" y="546" class="note">every write computed before an invalidation is refused &#8212; the invalidation guard, always on; a forced refresh is guarded like a miss</text>
	</g>
	
	<!-- ============ THE RESOLVER ============ -->
	<path d="M28,576 H924 V678 L912,690 H16 V588 Z" fill="#0d0d17" stroke="#00f0ff" stroke-width="1" opacity="0.9"/>
	<path d="M28,576 H924 V604 H16 V588 Z" fill="#00f0ff" opacity="0.1"/>
	<line x1="16" y1="604" x2="924" y2="604" stroke="#00f0ff" stroke-width="1" opacity="0.7"/>
	<text x="470" y="595" class="panelHead" fill="#00f0ff">THE RESOLVER DECIDES &#8212; function($store, $key, &amp;$ttl, &amp;$tags, &amp;$save)</text>
	<g>
		<path d="M30,620 H310 V660 L304,666 H30 Z" fill="#11111c" stroke="#00f0ff" opacity="0.9"/>
		<text x="170" y="639" class="code">$ttl = $response-&gt;secondsValid;</text>
		<text x="170" y="656" class="note">the TTL from what it computed</text>
		<path d="M330,620 H610 V660 L604,666 H330 Z" fill="#11111c" stroke="#00f0ff" opacity="0.9"/>
		<text x="470" y="639" class="code">$tags[] = 'route_' . $response-&gt;routeId;</text>
		<text x="470" y="656" class="note">the tags an invalidation reaches it by</text>
		<path d="M630,620 H910 V660 L904,666 H630 Z" fill="#11111c" stroke="#00f0ff" opacity="0.9"/>
		<text x="770" y="639" class="code">$save = $response-&gt;isComplete();</text>
		<text x="770" y="656" class="note">false: handed back, nothing kept, the lock freed</text>
	</g>
	
	<text x="24" y="704" class="foot">Redis &#183; Redisearch &#183; RedisVersioned &#183; RedisClusterVersioned &#183; Apcu (no tags: no soft, no hard) &#8212; every option is per call</text>
</svg>
