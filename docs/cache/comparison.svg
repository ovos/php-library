<svg xmlns="http://www.w3.org/2000/svg" width="940" height="486" viewBox="0 0 940 486" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aDel" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
    <style>
      .title{font-size:18px;font-weight:700;fill:#fff}
      .subtitle{font-size:12px;fill:#cbd5e1}
      .colHead{font-size:14px;font-weight:700;fill:#fff}
      .colSub{font-size:9.5px;fill:#fff;opacity:.85}
      .struct{font-family:Consolas,monospace;font-size:10.5px;font-weight:700}
      .small{font-size:10px;fill:#475569}
      .smallC{font-size:10px;fill:#475569;text-anchor:middle}
      .item{font-family:Consolas,monospace;font-size:9px;text-anchor:middle}
      .cost{font-size:13px;font-weight:700;text-anchor:middle}
      .costSub{font-size:9px;text-anchor:middle;fill:#64748b}
      .lazy{font-size:8.5px;fill:#64748b;text-anchor:middle;font-style:italic}
    </style>
  </defs>

  <rect width="940" height="486" fill="#ffffff"/>
  <rect width="940" height="58" fill="#1e293b"/>
  <text x="24" y="27" class="title">Cache backends &#8212; how invalidating a tag behaves</text>
  <text x="24" y="46" class="subtitle">What happens when you call invalidateTags(['t']) and N cached items carry tag t</text>

  <!-- ============ COLUMN 1: Redis ============ -->
  <g>
    <rect x="16" y="72" width="212" height="378" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <path d="M16 82 a10 10 0 0 1 10 -10 h192 a10 10 0 0 1 10 10 v28 h-212 z" fill="#be123c"/>
    <text x="122" y="92" text-anchor="middle" class="colHead">Redis</text>
    <text x="122" y="105" text-anchor="middle" class="colSub">legacy tag-hash</text>

    <rect x="47" y="124" width="150" height="34" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="122" y="145" text-anchor="middle" class="struct" fill="#b45309">tags:&#123;t&#125; hash</text>

    <line x1="122" y1="160" x2="122" y2="184" stroke="#dc2626" stroke-width="2" marker-end="url(#aDel)"/>
    <text x="200" y="178" text-anchor="end" class="small" fill="#b91c1c">HSCAN</text>

    <g>
      <rect x="40" y="192" width="50" height="30" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="3 2"/>
      <rect x="97" y="192" width="50" height="30" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="3 2"/>
      <rect x="154" y="192" width="50" height="30" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="3 2"/>
      <text x="65" y="211" class="item" fill="#b91c1c">item</text>
      <text x="122" y="211" class="item" fill="#b91c1c">item</text>
      <text x="179" y="211" class="item" fill="#b91c1c">item</text>
      <line x1="48" y1="196" x2="82" y2="218" stroke="#dc2626" stroke-width="1.3"/><line x1="82" y1="196" x2="48" y2="218" stroke="#dc2626" stroke-width="1.3"/>
      <line x1="105" y1="196" x2="139" y2="218" stroke="#dc2626" stroke-width="1.3"/><line x1="139" y1="196" x2="105" y2="218" stroke="#dc2626" stroke-width="1.3"/>
      <line x1="162" y1="196" x2="196" y2="218" stroke="#dc2626" stroke-width="1.3"/><line x1="196" y1="196" x2="162" y2="218" stroke="#dc2626" stroke-width="1.3"/>
    </g>

    <text x="122" y="252" class="smallC" font-weight="700" fill="#0f172a">Every matched item is</text>
    <text x="122" y="268" class="smallC" font-weight="700" fill="#0f172a">deleted now (UNLINK).</text>
    <text x="122" y="290" class="smallC">Work scales with how</text>
    <text x="122" y="304" class="smallC">many items match.</text>
    <text x="122" y="326" class="smallC">getTags / getAllTags</text>
    <text x="122" y="340" class="smallC">expose the tag map.</text>

    <rect x="40" y="396" width="164" height="40" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="122" y="416" class="cost" fill="#b91c1c">O(N)</text>
    <text x="122" y="430" class="costSub">eager delete, hash scan</text>
  </g>

  <!-- ============ COLUMN 2: Redisearch ============ -->
  <g>
    <rect x="248" y="72" width="212" height="378" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <path d="M248 82 a10 10 0 0 1 10 -10 h192 a10 10 0 0 1 10 10 v28 h-212 z" fill="#7c3aed"/>
    <text x="354" y="92" text-anchor="middle" class="colHead">Redisearch</text>
    <text x="354" y="105" text-anchor="middle" class="colSub">RediSearch TAG index</text>

    <rect x="279" y="124" width="150" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="354" y="145" text-anchor="middle" class="struct" fill="#6d28d9">FT index (tags)</text>

    <line x1="354" y1="160" x2="354" y2="184" stroke="#dc2626" stroke-width="2" marker-end="url(#aDel)"/>
    <text x="432" y="178" text-anchor="end" class="small" fill="#b91c1c">FT.SEARCH</text>

    <g>
      <rect x="272" y="192" width="50" height="30" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="3 2"/>
      <rect x="329" y="192" width="50" height="30" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="3 2"/>
      <rect x="386" y="192" width="50" height="30" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="3 2"/>
      <text x="297" y="211" class="item" fill="#b91c1c">item</text>
      <text x="354" y="211" class="item" fill="#b91c1c">item</text>
      <text x="411" y="211" class="item" fill="#b91c1c">item</text>
      <line x1="280" y1="196" x2="314" y2="218" stroke="#dc2626" stroke-width="1.3"/><line x1="314" y1="196" x2="280" y2="218" stroke="#dc2626" stroke-width="1.3"/>
      <line x1="337" y1="196" x2="371" y2="218" stroke="#dc2626" stroke-width="1.3"/><line x1="371" y1="196" x2="337" y2="218" stroke="#dc2626" stroke-width="1.3"/>
      <line x1="394" y1="196" x2="428" y2="218" stroke="#dc2626" stroke-width="1.3"/><line x1="428" y1="196" x2="394" y2="218" stroke="#dc2626" stroke-width="1.3"/>
    </g>

    <text x="354" y="252" class="smallC" font-weight="700" fill="#0f172a">Same eager delete &#8212;</text>
    <text x="354" y="268" class="smallC" font-weight="700" fill="#0f172a">but matches come from</text>
    <text x="354" y="282" class="smallC" font-weight="700" fill="#0f172a">the search index.</text>
    <text x="354" y="304" class="smallC">No tag bookkeeping in</text>
    <text x="354" y="318" class="smallC">PHP; index self-updates.</text>
    <text x="354" y="340" class="smallC">Needs RediSearch module.</text>

    <rect x="272" y="396" width="164" height="40" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="354" y="416" class="cost" fill="#b91c1c">O(N)</text>
    <text x="354" y="430" class="costSub">eager delete, index lookup</text>
  </g>

  <!-- ============ COLUMN 3: RedisVersioned ============ -->
  <g>
    <rect x="480" y="72" width="212" height="378" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <path d="M480 82 a10 10 0 0 1 10 -10 h192 a10 10 0 0 1 10 10 v28 h-212 z" fill="#16a34a"/>
    <text x="586" y="92" text-anchor="middle" class="colHead">RedisVersioned</text>
    <text x="586" y="105" text-anchor="middle" class="colSub">rule stream (logical)</text>

    <rect x="511" y="124" width="150" height="34" rx="6" fill="#fce7f3" stroke="#be185d"/>
    <text x="557" y="145" text-anchor="middle" class="struct" fill="#be185d">rules</text>
    <rect x="628" y="129" width="26" height="24" rx="5" fill="#be185d"/>
    <text x="641" y="146" text-anchor="middle" class="struct" fill="#fff">+1</text>

    <text x="586" y="178" text-anchor="middle" class="small" fill="#15803d" font-weight="700">append ONE rule &#8595;</text>

    <g>
      <rect x="504" y="192" width="50" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
      <rect x="561" y="192" width="50" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
      <rect x="618" y="192" width="50" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="529" y="211" class="item" fill="#475569">item</text>
      <text x="586" y="211" class="item" fill="#475569">item</text>
      <text x="643" y="211" class="item" fill="#475569">item</text>
      <text x="586" y="236" class="lazy">untouched &#8212; still in memory</text>
    </g>

    <text x="586" y="262" class="smallC" font-weight="700" fill="#0f172a">Matched items are NOT</text>
    <text x="586" y="276" class="smallC" font-weight="700" fill="#0f172a">deleted. The next read</text>
    <text x="586" y="290" class="smallC" font-weight="700" fill="#0f172a">sees the rule and skips</text>
    <text x="586" y="304" class="smallC" font-weight="700" fill="#0f172a">them; TTL expires them.</text>
    <text x="586" y="326" class="smallC">Rules evaluated in PHP</text>
    <text x="586" y="340" class="smallC">over a cached set.</text>

    <rect x="504" y="396" width="164" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="586" y="416" class="cost" fill="#15803d">O(1)</text>
    <text x="586" y="430" class="costSub">10 or 700 000 items: same</text>
  </g>

  <!-- ============ COLUMN 4: RedisClusterVersioned ============ -->
  <g>
    <rect x="712" y="72" width="212" height="378" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <path d="M712 82 a10 10 0 0 1 10 -10 h192 a10 10 0 0 1 10 10 v28 h-212 z" fill="#0891b2"/>
    <text x="818" y="92" text-anchor="middle" class="colHead">RedisClusterVersioned</text>
    <text x="818" y="105" text-anchor="middle" class="colSub">versioned, across slots</text>

    <rect x="743" y="124" width="150" height="34" rx="6" fill="#fce7f3" stroke="#be185d"/>
    <text x="789" y="145" text-anchor="middle" class="struct" fill="#be185d">rules</text>
    <rect x="860" y="129" width="26" height="24" rx="5" fill="#be185d"/>
    <text x="873" y="146" text-anchor="middle" class="struct" fill="#fff">+1</text>

    <text x="818" y="178" text-anchor="middle" class="small" fill="#15803d" font-weight="700">append ONE rule &#8595;</text>

    <g>
      <rect x="736" y="192" width="50" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
      <rect x="793" y="192" width="50" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
      <rect x="850" y="192" width="50" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="761" y="211" class="item" fill="#475569">item</text>
      <text x="818" y="211" class="item" fill="#475569">item</text>
      <text x="875" y="211" class="item" fill="#475569">item</text>
      <text x="818" y="236" class="lazy">untouched &#8212; still in memory</text>
    </g>

    <text x="818" y="262" class="smallC" font-weight="700" fill="#0f172a">Same read model as</text>
    <text x="818" y="276" class="smallC" font-weight="700" fill="#0f172a">RedisVersioned.</text>
    <text x="818" y="298" class="smallC">Item and rules live in</text>
    <text x="818" y="312" class="smallC">different slots, so set()</text>
    <text x="818" y="326" class="smallC">reads the watermark in</text>
    <text x="818" y="340" class="smallC">a separate step.</text>

    <rect x="736" y="396" width="164" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="818" y="416" class="cost" fill="#15803d">O(1)</text>
    <text x="818" y="430" class="costSub">same, across cluster slots</text>
  </g>

  <line x1="240" y1="120" x2="240" y2="370" stroke="#e2e8f0" stroke-dasharray="2 4"/>
  <line x1="704" y1="120" x2="704" y2="370" stroke="#cbd5e1" stroke-dasharray="2 4"/>
  <text x="704" y="466" text-anchor="middle" class="small" fill="#94a3b8">&#8592; delete matched items (cost grows with N)&#160;&#160;&#160;&#160;|&#160;&#160;&#160;&#160;append a rule, resolve lazily (constant cost) &#8594;</text>
</svg>
