<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
	<defs>
		<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
			<rect width="4" height="1" fill="#ffffff" opacity="0.018"/>
		</pattern>
		<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="4" result="halo"/>
			<feComponentTransfer in="halo" result="dim">
				<feFuncA type="linear" slope="0.45"/>
			</feComponentTransfer>
			<feMerge>
				<feMergeNode in="dim"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
	</defs>

	<!-- board plate -->
	<path d="M12,0 H928 L940,12 V408 L928,420 H12 L0,408 V12 Z" fill="#0b0b12"/>
	<path d="M12,0 H928 L940,12 V408 L928,420 H12 L0,408 V12 Z" fill="url(#scan)"/>
	<path d="M12,0.5 H928 L939.5,12 V408 L928,419.5 H12 L0.5,408 V12 Z"
		fill="none" stroke="#26263a" stroke-width="1"/>

	<!-- accent traces on the chamfers: the yellow + cyan pair -->
	<path d="M0.5,60 V12 L12,0.5 H72" fill="none" stroke="#fcee0a" stroke-width="1.5"/>
	<path d="M939.5,360 V408 L928,419.5 H868" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>

	<!-- eyebrow -->
	<text x="40" y="44" font-size="11" font-weight="600" letter-spacing="5" fill="#8b8ba7">OVOS</text>
	<rect x="116" y="35" width="1" height="10" fill="#3a3a52"/>
	<text x="130" y="44" font-size="11" font-weight="600" letter-spacing="5"
		fill="#00f0ff" opacity="0.8">FRAMEWORK HIGHLIGHTS</text>
	<text x="902" y="52" font-size="34" font-weight="700" fill="#191926"
		text-anchor="end" font-family="Consolas, 'Courier New', monospace">//</text>

	<!-- connecting spine under the eyebrow -->
	<path d="M40,62 H360 l6,6 H900" fill="none" stroke="#26263a" stroke-width="1"/>
	<path d="M40,62 H150" fill="none" stroke="#fcee0a" stroke-width="2"/>

	<!-- ============ ROW 1 ============ -->

	<!-- CACHE -->
	<path d="M52,90 H300 V208 L288,220 H40 V102 Z" fill="#0d0d17" stroke="#26263a" stroke-width="1"/>
	<path d="M52,90 H122" fill="none" stroke="#fcee0a" stroke-width="2"/>
	<text x="284" y="112" font-size="12" fill="#fcee0a" opacity="0.30" text-anchor="end"
		font-family="Consolas, 'Courier New', monospace">01</text>
	<text x="62" y="136" font-size="21" font-weight="700" letter-spacing="2"
		fill="#fcee0a" filter="url(#glow)" font-family="Consolas, 'Courier New', monospace">CACHE</text>
	<text x="62" y="168" font-size="12.5" fill="#8b8ba7" font-family="Consolas, 'Courier New', monospace">MemoLock &#8212; one request</text>
	<text x="62" y="188" font-size="12.5" fill="#8b8ba7" font-family="Consolas, 'Courier New', monospace">rebuilds, the rest wait</text>

	<!-- SESSIONS -->
	<path d="M352,90 H600 V208 L588,220 H340 V102 Z" fill="#0d0d17" stroke="#26263a" stroke-width="1"/>
	<path d="M352,90 H422" fill="none" stroke="#00f0ff" stroke-width="2"/>
	<text x="584" y="112" font-size="12" fill="#00f0ff" opacity="0.30" text-anchor="end"
		font-family="Consolas, 'Courier New', monospace">02</text>
	<text x="362" y="136" font-size="21" font-weight="700" letter-spacing="2"
		fill="#00f0ff" filter="url(#glow)" font-family="Consolas, 'Courier New', monospace">SESSIONS</text>
	<text x="362" y="168" font-size="12.5" fill="#8b8ba7" font-family="Consolas, 'Courier New', monospace">lazy RedisJSON, per-path</text>
	<text x="362" y="188" font-size="12.5" fill="#8b8ba7" font-family="Consolas, 'Courier New', monospace">reads &#183; searchable index</text>

	<!-- ROUTING -->
	<path d="M652,90 H900 V208 L888,220 H640 V102 Z" fill="#0d0d17" stroke="#26263a" stroke-width="1"/>
	<path d="M652,90 H722" fill="none" stroke="#fcee0a" stroke-width="2"/>
	<text x="884" y="112" font-size="12" fill="#fcee0a" opacity="0.30" text-anchor="end"
		font-family="Consolas, 'Courier New', monospace">03</text>
	<text x="662" y="136" font-size="21" font-weight="700" letter-spacing="2"
		fill="#fcee0a" filter="url(#glow)" font-family="Consolas, 'Courier New', monospace">ROUTING</text>
	<text x="662" y="168" font-size="12.5" fill="#8b8ba7" font-family="Consolas, 'Courier New', monospace">SEO slugs derived from</text>
	<text x="662" y="188" font-size="12.5" fill="#8b8ba7" font-family="Consolas, 'Courier New', monospace">models &#183; 301 canonical</text>

	<!-- ============ ROW 2 ============ -->

	<!-- RELATIONS -->
	<path d="M52,250 H300 V368 L288,380 H40 V262 Z" fill="#0d0d17" stroke="#26263a" stroke-width="1"/>
	<path d="M52,250 H122" fill="none" stroke="#00f0ff" stroke-width="2"/>
	<text x="284" y="272" font-size="12" fill="#00f0ff" opacity="0.30" text-anchor="end"
		font-family="Consolas, 'Courier New', monospace">04</text>
	<text x="62" y="296" font-size="21" font-weight="700" letter-spacing="2"
		fill="#00f0ff" filter="url(#glow)" font-family="Consolas, 'Courier New', monospace">RELATIONS</text>
	<text x="62" y="328" font-size="12.5" fill="#8b8ba7" font-family="Consolas, 'Courier New', monospace">declared as attributes</text>
	<text x="62" y="348" font-size="12.5" fill="#8b8ba7" font-family="Consolas, 'Courier New', monospace">batch-loaded &#183; zero N+1</text>

	<!-- PROFILER -->
	<path d="M352,250 H600 V368 L588,380 H340 V262 Z" fill="#0d0d17" stroke="#26263a" stroke-width="1"/>
	<path d="M352,250 H422" fill="none" stroke="#fcee0a" stroke-width="2"/>
	<text x="584" y="272" font-size="12" fill="#fcee0a" opacity="0.30" text-anchor="end"
		font-family="Consolas, 'Courier New', monospace">05</text>
	<text x="362" y="296" font-size="21" font-weight="700" letter-spacing="2"
		fill="#fcee0a" filter="url(#glow)" font-family="Consolas, 'Courier New', monospace">PROFILER</text>
	<text x="362" y="328" font-size="12.5" fill="#8b8ba7" font-family="Consolas, 'Courier New', monospace">live per-request stream</text>
	<text x="362" y="348" font-size="12.5" fill="#8b8ba7" font-family="Consolas, 'Courier New', monospace">queries &#183; redis &#183; timings</text>

	<!-- CONTAINER -->
	<path d="M652,250 H900 V368 L888,380 H640 V262 Z" fill="#0d0d17" stroke="#26263a" stroke-width="1"/>
	<path d="M652,250 H722" fill="none" stroke="#00f0ff" stroke-width="2"/>
	<text x="884" y="272" font-size="12" fill="#00f0ff" opacity="0.30" text-anchor="end"
		font-family="Consolas, 'Courier New', monospace">06</text>
	<text x="662" y="296" font-size="21" font-weight="700" letter-spacing="2"
		fill="#00f0ff" filter="url(#glow)" font-family="Consolas, 'Courier New', monospace">CONTAINER</text>
	<text x="662" y="328" font-size="12.5" fill="#8b8ba7" font-family="Consolas, 'Courier New', monospace">attribute injection</text>
	<text x="662" y="348" font-size="12.5" fill="#8b8ba7" font-family="Consolas, 'Courier New', monospace">+ zero-config autowire</text>
</svg>
